//====================================================================================================================//
//                                       Zombie Mod Infection - Cvars Config                                          //
//====================================================================================================================//

//===============================================//
//               General Cvars                   //
//==============================================//
zmod_delay "18"                         // Delay before selecting the first zombie at round start (seconds)
zmod_lights "a"                       // Map lighting level ("a" = darkest, "z" = brightest)
zmod_thunderclap "60"                  // Interval for thunderclap sound effect (seconds)
zmod_auto_restart_enabled "1"          // Enable automatic server restart (0 = OFF, 1 = ON)
zmod_auto_restart_seconds "60"         // Time before auto restart triggers (seconds)
zmod_weapons_display "1"               // Display available weapons to players (0 = OFF, 1 = ON)
zmod_weapons_shotguns "1"              // Enable shotguns (0 = OFF, 1 = ON)
zmod_weapons_smgs "1"                  // Enable SMGs (0 = OFF, 1 = ON)
zmod_weapons_rifles "0"                // Enable Rifles (0 = OFF, 1 = ON)
zmod_weapons_snipers "0"               // Enable Sniper Rifles (0 = OFF, 1 = ON)
zmod_weapons_autosnipers "0"               // Enable Auto Snipers (0 = OFF, 1 = ON)
zmod_weapon_alt_names "0"              // Switch between 2 ways of weapon names (0 = Normal game names, 1 = Alternative names)
zmod_description "[ZM] Zombie Mod Infection"           // Mod description displayed in-game
zmod_custom_win_sounds "0"              // Enable custom win sounds (0 = OFF, 1 = ON)
zmod_block_hud_messages "0"              // Disable end round messages (0 = OFF, 1 = ON)
zmod_he_hitself "1"              // Allow he grenade to cause damage to owner (0 = OFF, 1 = ON)

//================================================//
//              NVG (Night Vision)                //
//================================================//
zmod_nvg_custom "0"                    // Enable/Disable custom nightvision (0 = OFF, 1 = ON)
zmod_nvg_size "140"                    // Night vision size
zmod_nvg_color_r "0"                   // NVG color - red
zmod_nvg_color_g "255"                 // NVG color - green
zmod_nvg_color_b "0"                   // NVG color - blue

//===================================================//
//                 Zombie Settings                   //
//===================================================//
zmod_zombie_armor "0.75"               // Percentage of bullet damage converted into zombie armor (default: 0.75)
zmod_zombie_brainhealth "100"          // Additional brain health for zombies (default: 100)
zmod_firstzombie_health "6000"         // Health of the first zombie (default: 6000)
zmod_zombie_health "2250"              // Regular zombie health (default: 3000)
zmod_zombie_speed "260.0"              // Zombie movement speed (default: 260.0)
zmod_zombie_gravity "0.9"              // Zombie gravity level (default: 0.9)
zmod_superzombie_health "60000"        // Super zombie health (default: 60000)
zmod_superzombie_speed "260.0"         // Super zombie movement speed (default: 260.0)
zmod_superzombie_gravity "0.6"         // Super zombie gravity level (default: 0.6)
zmod_superzombie_chance "20"           // Percent chance to become super zombie (percentage, default: 20)
zmod_superzombie_enabled "0"           // Enable or disable super zombies (0 = OFF, 1 = ON)

//==================================================//
//              Human Settings                      //
//==================================================//
zmod_human_health "100"                // Human starting health (default: 100)
zmod_human_speed "240.0"               // Human movement speed (default: 240.0)
zmod_human_gravity "0.9"              // Human gravity level (default: 0.9)
zmod_human_clipcost "200"              // Ammo cost per extra clip purchase (default: 200)
zmod_human_unlimited_ammo "0"          // Enable unlimited ammo for humans (0 = OFF, 1 = Unlimited BpAmmo, 2 = Unlimited Clip)
