//====================================================================================================================//
//                                       Zombie Mod Infection - Cvars Config                                          //
//====================================================================================================================//

//===============================================//
//               General Cvars                   //
//===============================================//

zmod_enabled "1"                         // Master switch for the mod (0 = OFF, 1 = ON)
zmod_min_players "4"                     // Minimum players required to start the infection
zmod_delay "18"                          // Delay before selecting the first zombie at round start (seconds)
zmod_description "[ZM] Zombie Mod Infection" // Mod description shown in game
zmod_custom_win_sounds "0"               // Enable custom win sounds (0 = OFF, 1 = ON)
zmod_block_hud_messages "0"              // Disable end round messages (0 = OFF, 1 = ON)
zmod_he_hitself "1"                      // Allow HE grenade to damage its owner (0 = OFF, 1 = ON)

//===============================================//
//               Weapon Menu Settings            //
//===============================================//

zmod_weapons_display "1"                 // Show weapon selection menu to humans (0 = OFF, 1 = ON)
zmod_weapon_alt_names "0"                // Weapon name style (0 = normal, 1 = alternative)
zmod_weapons_shotguns "1"                // Enable shotguns category (0 = OFF, 1 = ON)
zmod_weapons_smgs "1"                    // Enable SMGs category (0 = OFF, 1 = ON)
zmod_weapons_rifles "0"                  // Enable rifles category (0 = OFF, 1 = ON)
zmod_weapons_snipers "0"                 // Enable sniper rifles category (0 = OFF, 1 = ON)
zmod_weapons_autosnipers "0"             // Enable auto snipers category (0 = OFF, 1 = ON)

//===============================================//
//           Individual Weapon Cvars             //
//===============================================//
// 0 = disallowed, 1 = allowed
zmod_weapon_m3 "1"                       // Pump Shotgun (M3)
zmod_weapon_xm1014 "1"                   // Auto Shotgun (XM1014)
zmod_weapon_tmp "1"                      // TMP
zmod_weapon_mac10 "1"                    // MAC-10
zmod_weapon_mp5navy "1"                  // MP5 Navy
zmod_weapon_p90 "1"                      // P90
zmod_weapon_ump45 "1"                    // UMP45
zmod_weapon_famas "1"                    // Famas
zmod_weapon_galil "1"                    // Galil
zmod_weapon_ak47 "1"                     // AK-47
zmod_weapon_m4a1 "1"                     // M4A1
zmod_weapon_sg552 "1"                    // SG552
zmod_weapon_aug "1"                      // AUG
zmod_weapon_scout "1"                    // Scout
zmod_weapon_awp "1"                      // AWP
zmod_weapon_sg550 "1"                    // SG550
zmod_weapon_g3sg1 "1"                    // G3SG1

//===============================================//
//              Zombie Settings                  //
//===============================================//

zmod_zombie_armor "0.75"                 // Damage multiplier when zombies are hit (0.75 = 25% damage reduction)
zmod_zombie_brainhealth "100"            // Health added to attacker after infecting a human
zmod_firstzombie_health "6000"           // First zombie starting health
zmod_silent_firstzombie "1"		 // First zombie silent footsteps
zmod_zombie_health "2250"                // Regular zombie health
zmod_zombie_speed "260.0"                // Zombie movement speed
zmod_zombie_gravity "0.9"                // Zombie gravity (1.0 = normal)
zmod_superzombie_health "60000"          // Super zombie health
zmod_superzombie_speed "260.0"           // Super zombie speed
zmod_superzombie_gravity "0.6"           // Super zombie gravity
zmod_superzombie_chance "20"             // Chance (1 in N) for super zombie round when enabled
zmod_superzombie_enabled "0"             // Enable super zombie mode (0 = OFF, 1 = ON)
zmod_multi_chance "3"                    // Chance (1 in N) for multiple infection round
zmod_multi_min_players "12"              // Minimum players required for multiple infection round

//===============================================//
//              Human Settings                   //
//===============================================//

zmod_human_health "100"                  // Human starting health
zmod_human_speed "240.0"                 // Human movement speed
zmod_human_gravity "0.9"                 // Human gravity (1.0 = normal)
zmod_human_clipcost "200"                // Cost to buy a full clip of ammunition (in dollars)
zmod_human_unlimited_ammo "0"            // Unlimited ammo mode (0 = OFF, 1 = unlimited BP ammo, 2 = unlimited clip)

//===============================================//
//            Auto Restart (zmod_auto_restart)   //
//===============================================//

zmod_auto_restart_enabled "1"            // Enable automatic restart when server is empty (0 = OFF, 1 = ON)
zmod_auto_restart_seconds "60"           // Countdown seconds before restart

//===============================================//
//           Map Lightning & Thunder            //
//===============================================//

zmod_lights "a"                          // Map lighting style (a = darkest, z = brightest, 0 = disable)
zmod_thunderclap "60"                    // Interval between thunder claps (seconds, 0 = disable)

//===============================================//
//               Nightvision (NVG)              //
//===============================================//

zmod_nvg_custom "0"                      // Enable custom nightvision (dynamic light effect) (0 = OFF, 1 = ON)
zmod_nvg_size "140"                      // Radius of the custom nightvision light
zmod_nvg_color_r "0"                     // Red component (0-255)
zmod_nvg_color_g "255"                   // Green component (0-255)
zmod_nvg_color_b "0"                     // Blue component (0-255)

//===============================================//
//               Custom Sky (zmod_sky)           //
//===============================================//

zmod_custom_sky_enabled "1"              // Enable custom sky (0 = OFF, 1 = ON)
zmod_sky_name "blood_"                   // Sky texture name (e.g., "blood_", "space", etc.)
